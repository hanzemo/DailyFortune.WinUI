name: Build MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore DailyFortune.WinUI.csproj

      - name: Publish MSIX
        run: >
          dotnet publish DailyFortune.WinUI.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxPackageSigningEnabled=false
          -p:AppxBundle=Never
          -p:GenerateAppxPackageOnBuild=true
          -o publish

      - name: Find all msix/appx/msixupload
        shell: pwsh
        run: |
          Write-Host "=== msix ==="
          Get-ChildItem -Path . -Recurse -Include *.msix,*.appx,*.msixupload -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

      - name: List publish
        shell: pwsh
        run: Get-ChildItem -Path publish -Recurse | Select-Object FullName

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: DailyFortune-MSIX
          path: |
            **/*.msix
            **/*.appx
          if-no-files-found: warn
