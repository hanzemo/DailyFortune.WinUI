name: Build MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore DailyFortune.WinUI.csproj

      - name: Build MSIX
        run: msbuild DailyFortune.WinUI.csproj /p:Configuration=Release /p:Platform=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false

      - name: Find MSIX
        run: Get-ChildItem -Path . -Recurse -Filter *.msix | Select-Object FullName

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: DailyFortune-MSIX
          path: '**/*.msix'
          if-no-files-found: error
