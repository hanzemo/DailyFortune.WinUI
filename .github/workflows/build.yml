name: Build Signed MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate self-signed cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=hanzemo, O=DailyFortune, C=CN" `
            -KeyUsage DigitalSignature `
            -FriendlyName "DailyFortune" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          Write-Host "SUBJECT: $($cert.Subject)"
          Write-Host "THUMBPRINT: $($cert.Thumbprint)"

          # 导出 pfx
          $pwd = ConvertTo-SecureString -String "DailyFortune123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "${{ github.workspace }}\cert.pfx" -Password $pwd

          # 导出 cer（供用户装信任）
          Export-Certificate -Cert $cert -FilePath "${{ github.workspace }}\cert\DailyFortune.cer"

          # pfx 转 base64（存 artifact）
          $bytes = [IO.File]::ReadAllBytes("${{ github.workspace }}\cert.pfx")
          $b64 = [Convert]::ToBase64String($bytes)
          $b64 | Out-File "${{ github.workspace }}\cert\DailyFortune.pfx.b64" -Encoding ASCII

      - name: Verify manifest Publisher matches cert
        shell: pwsh
        run: |
          [xml]$m = Get-Content "${{ github.workspace }}\Package.appxmanifest"
          $pub = $m.Package.Identity.Publisher
          Write-Host "MANIFEST PUBLISHER: $pub"

      - name: Restore
        run: dotnet restore DailyFortune.WinUI.csproj -r win-x64

      - name: Build signed MSIX
        shell: cmd
        run: |
          msbuild DailyFortune.WinUI.csproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:RuntimeIdentifier=win-x64 ^
            /p:UapAppxPackageBuildMode=SideloadOnly ^
            /p:AppxBundle=Never ^
            /p:AppxPackageSigningEnabled=true ^
            /p:PackageCertificateKeyFile="${{ github.workspace }}\cert.pfx" ^
            /p:PackageCertificatePassword=DailyFortune123 ^
            /p:GenerateAppxPackageOnBuild=true

      - name: Find MSIX
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.msix,*.appx | Select-Object FullName, Length

      - name: Upload MSIX + CER
        uses: actions/upload-artifact@v4
        with:
          name: DailyFortune-SignedMSIX
          path: |
            **/*.msix
            **/*.appx
            cert/DailyFortune.cer
            cert/DailyFortune.pfx.b64
          if-no-files-found: error
