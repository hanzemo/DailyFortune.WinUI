name: Build Signed MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Remove old cert
        shell: pwsh
        run: |
          Remove-Item "${{ github.workspace }}\cert.pfx" -Force -ErrorAction SilentlyContinue

      - name: Generate + import cert
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=hanzemo, O=DailyFortune, C=CN" `
            -KeyUsage DigitalSignature `
            -FriendlyName "DailyFortune" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          Write-Host "SUBJECT: $($cert.Subject)"
          Write-Host "THUMBPRINT: $($cert.Thumbprint)"
          echo "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

          Export-Certificate -Cert $cert -FilePath "${{ github.workspace }}\cert\DailyFortune.cer"

      - name: Verify manifest Publisher
        shell: pwsh
        run: |
          [xml]$m = Get-Content "${{ github.workspace }}\Package.appxmanifest"
          Write-Host "MANIFEST PUBLISHER: $($m.Package.Identity.Publisher)"

      - name: Restore
        run: dotnet restore DailyFortune.WinUI.csproj -r win-x64

      - name: Build signed MSIX (thumbprint)
        shell: cmd
        run: |
          msbuild DailyFortune.WinUI.csproj ^
            /t:Rebuild ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:RuntimeIdentifier=win-x64 ^
            /p:UapAppxPackageBuildMode=SideloadOnly ^
            /p:AppxBundle=Never ^
            /p:AppxPackageSigningEnabled=true ^
            /p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} ^
            /p:GenerateAppxPackageOnBuild=true

      - name: Find MSIX
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.msix,*.appx | Select-Object FullName, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DailyFortune-SignedMSIX
          path: |
            **/*.msix
            **/*.appx
            cert/DailyFortune.cer
          if-no-files-found: error
