name: Build Signed MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Decode certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}\cert.pfx", $bytes)
          Write-Host "cert.pfx written, size = $($bytes.Length)"

      - name: Restore
        run: dotnet restore DailyFortune.WinUI.csproj -r win-x64

      - name: Build signed MSIX
        shell: pwsh
        run: |
          msbuild DailyFortune.WinUI.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="${{ github.workspace }}\cert.pfx" `
            /p:PackageCertificatePassword="${{ secrets.CERT_PASSWORD }}" `
            /p:GenerateAppxPackageOnBuild=true

      - name: Find MSIX
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.msix,*.appx | Select-Object FullName, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DailyFortune-SignedMSIX
          path: |
            **/*.msix
            **/*.appx
          if-no-files-found: error
