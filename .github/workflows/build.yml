name: Build Single EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Single EXE
        run: >
          dotnet publish DailyFortune.WinUI.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: List output
        shell: pwsh
        run: Get-ChildItem publish | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DailyFortune-SingleEXE
          path: |
            publish/DailyFortune.WinUI.exe
          if-no-files-found: error
